[project]
name = "super-baranda-entregas"
version = "0.1.0"
description = "PWA de controle de entregas do Super Baranda"
requires-python = ">=3.14"
dependencies = ["Django>=5.2.8,<5.3", "whitenoise>=6.9,<7", "waitress>=3,<4"]

[dependency-groups]
dev = ["ruff", "pytest", "pytest-django", "playwright"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "tests.py"]
