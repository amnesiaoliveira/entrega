{% extends 'base.html' %}
{% block title %}Entrar · Super Baranda{% endblock %}
{% block body %}
<main class="login-layout">
  <section class="login-panel" aria-labelledby="login-title">
    <form method="post" class="login-form">
      {% csrf_token %}
      <header class="login-header">
        <a class="brand" href="/" aria-label="Super Baranda"><span class="brand-mark">b<span>↗</span></span><span>super baranda</span></a>
        <h1 id="login-title">Entrar</h1>
      </header>
      {% if form.errors %}<p class="form-error" role="alert">Usuário ou senha inválidos.</p>{% endif %}
      <div class="login-field"><label for="id_username">Usuário</label><input id="id_username" name="username" autocomplete="username" maxlength="150" required autofocus></div>
      <div class="login-field"><label for="id_password">Senha</label><input id="id_password" name="password" type="password" autocomplete="current-password" required></div>
      <input type="hidden" name="next" value="{{ next }}">
      <button class="button primary" type="submit" aria-label="Entrar no painel">Entrar</button>
    </form>
  </section>
</main>
{% endblock %}
