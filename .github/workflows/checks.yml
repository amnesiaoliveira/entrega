name: Verificar aplicação
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv export --locked --no-dev --no-emit-project --format requirements-txt --output-file requirements-production.txt
      - run: git diff --exit-code -- requirements-production.txt
      - run: uv run playwright install --with-deps chromium
      - run: uv run python manage.py collectstatic --noinput
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python manage.py check
      - run: uv run python manage.py makemigrations --check --dry-run
      - run: uv run pytest -q
  installer-syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar PowerShell 5.1
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD\instalador.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count) { $errors | Format-List; exit 1 }
      - name: Verificar plataformas aceitas pelo instalador
        shell: powershell
        run: .\tests\verificar_instalador.ps1
